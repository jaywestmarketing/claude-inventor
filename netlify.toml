[build]
  command   = "npm run build"
  publish   = "out"

[build.environment]
  NODE_VERSION      = "20"
  NPM_FLAGS         = "--legacy-peer-deps"

# Configure the UI-installed plugin so it stops throwing "No source directory"
[[plugins]]
  package = "netlify-plugin-bundle-env"
  [plugins.inputs]
    # Must point at source code (plugin runs before build, out/ doesn't exist yet)
    source = "src"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "DENY"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type  = "application/xml"
    Cache-Control = "public, max-age=3600"

# 404 fallback for direct URL visits on static export
[[redirects]]
  from   = "/*"
  to     = "/404/index.html"
  status = 404
